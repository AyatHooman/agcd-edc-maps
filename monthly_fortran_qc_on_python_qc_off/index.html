<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly — Fortran QC enabled, Python QC disabled</title>
<style>
  html,body{height:100%}
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;margin:0;color:#222;background:#fff;
       display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;
         padding:.3rem .8rem;border-bottom:1px solid #eee;flex:0 0 auto}
  header a.back{font-size:.82rem;color:#1558b0;text-decoration:none;white-space:nowrap}
  header h1{font-size:.95rem;margin:0;white-space:nowrap;cursor:help}
  header .sep{color:#ccc}
  nav{display:contents}
  nav button, nav input[type=date]{font:inherit;font-size:.8rem;padding:.18rem .45rem;
      border:1px solid #ccd;border-radius:5px;background:#fff;cursor:pointer}
  nav button:hover{background:#e7eefc}
  nav button.active{background:#1558b0;color:#fff;border-color:#1558b0}
  nav button:disabled{opacity:.4;cursor:default}
  .count{color:#777;font-size:.78rem;white-space:nowrap}
  #wrap{flex:1 1 auto;overflow:auto;position:relative;
        display:flex;justify-content:center;align-items:center}
  #status{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;
          color:#555;font-size:.85rem;background:#fffbe8;border:1px solid #eed;
          border-radius:6px;padding:.2rem .7rem;display:none}
</style>
<script src="../assets/plotly.min.js"></script>
</head>
<body>
<header>
  <a class="back" href="../">&larr; All runs</a><span class="sep">|</span>
  <h1 title="EDC archive Fortran (own cross-validation screening active) vs Python fed every real gauge unscreened.  Tips: scroll on a panel zooms all panels together; drag pans; hover a station for its values and QC verdict; arrow keys change date.">Monthly — Fortran QC enabled, Python QC disabled</h1>
  <span class="sep">|</span>
  <nav id="nav"></nav>
</header>
<div id="wrap"><div id="status"></div><div id="map"></div></div>
<script>
"use strict";
const MODE = "monthly";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let DATES = [], current = -1;
const $ = id => document.getElementById(id);

function stemLabel(stem){
  if (MODE === "monthly") return MONTHS[parseInt(stem.slice(4, 6), 10) - 1] + " " + stem.slice(0, 4);
  return stem.slice(0, 4) + "-" + stem.slice(4, 6) + "-" + stem.slice(6, 8);
}
function isoOf(stem){ return stem.slice(0,4) + "-" + stem.slice(4,6) + "-" + (stem.length > 6 ? stem.slice(6,8) : "01"); }

function setStatus(msg){
  const el = $("status");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
}

function buildNav(){
  const nav = $("nav");
  nav.innerHTML = "";
  const prev = document.createElement("button");
  prev.textContent = "←"; prev.title = "previous (left arrow)";
  prev.onclick = () => go(current - 1); prev.id = "prev";
  nav.appendChild(prev);
  if (MODE === "monthly"){
    DATES.forEach((stem, i) => {
      const b = document.createElement("button");
      b.textContent = MONTHS[parseInt(stem.slice(4, 6), 10) - 1];
      b.dataset.i = i; b.onclick = () => go(i);
      nav.appendChild(b);
    });
  } else {
    const inp = document.createElement("input");
    inp.type = "date"; inp.id = "datepick";
    inp.min = isoOf(DATES[0]); inp.max = isoOf(DATES[DATES.length - 1]);
    inp.onchange = () => {
      const stem = inp.value.replaceAll("-", "");
      let best = 0, bestd = Infinity;
      DATES.forEach((s, i) => { const d = Math.abs(parseInt(s) - parseInt(stem)); if (d < bestd){ bestd = d; best = i; } });
      go(best);
    };
    nav.appendChild(inp);
  }
  const next = document.createElement("button");
  next.textContent = "→"; next.title = "next (right arrow)";
  next.onclick = () => go(current + 1); next.id = "next";
  nav.appendChild(next);
  const count = document.createElement("span");
  count.className = "count"; count.id = "count";
  nav.appendChild(count);
}

function markActive(){
  document.querySelectorAll("nav button[data-i]").forEach(b =>
    b.classList.toggle("active", parseInt(b.dataset.i) === current));
  const inp = $("datepick");
  if (inp) inp.value = isoOf(DATES[current]);
  $("count").textContent = (current + 1) + " / " + DATES.length;
  $("prev").disabled = current <= 0;
  $("next").disabled = current >= DATES.length - 1;
}

function resolveShared(fig){
  const shared = fig.shared || [];
  const fix = (obj, key) => {
    const v = obj && obj[key];
    if (typeof v === "string" && v.startsWith("@@shared:")) obj[key] = shared[parseInt(v.slice(9))];
  };
  for (const tr of fig.data){
    for (const k of ["x", "y", "z", "text"]) fix(tr, k);
    if (tr.marker) fix(tr.marker, "color");
  }
}

async function loadFig(stem){
  const resp = await fetch("data/" + stem + ".json.gz");
  if (!resp.ok) throw new Error("no map for " + stem + " (HTTP " + resp.status + ")");
  const buf = await resp.arrayBuffer();
  if (typeof DecompressionStream === "undefined")
    throw new Error("This browser cannot decompress gzip (needs DecompressionStream).");
  const ds = new DecompressionStream("gzip");
  const text = await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  const fig = JSON.parse(text);
  resolveShared(fig);
  return fig;
}

// ---- fit + restyle: scale the whole figure to the free space, and scale its
// fonts, margins and colorbars with it so nothing overlaps at small sizes ----
let baseW = 1500, baseH = 980;

function fittedSize(){
  const wrap = $("wrap");
  const availW = Math.max(100, wrap.clientWidth - 4);
  const availH = Math.max(100, wrap.clientHeight - 4);
  const s = Math.min(availW / baseW, availH / baseH);
  const w = Math.max(640, Math.round(baseW * s));       // floor: below this, allow scrolling
  return { width: w, height: Math.round(baseH * w / baseW) };
}

function restyle(fig){
  const size = fittedSize();
  const s = size.width / baseW;
  const L = fig.layout;
  L.width = size.width; L.height = size.height;
  L.title = undefined;                                   // the header already names run + date
  L.margin = { l: Math.round(58 * s) + 6, r: Math.round(88 * s) + 6,
               t: Math.round(26 * s) + 4, b: Math.round(84 * s) + 6 };
  const fs = m => Math.max(7, Math.round(m * s));
  L.font = Object.assign({}, L.font, { size: fs(12.5) });
  (L.annotations || []).forEach(a => {
    a.font = Object.assign({}, a.font, { size: fs(13.5) });
  });
  for (const tr of fig.data){
    const cb = tr.colorbar || (tr.marker && tr.marker.colorbar);
    if (!cb) continue;
    cb.thickness = Math.max(6, Math.round(13 * s));
    cb.tickfont = Object.assign({}, cb.tickfont, { size: fs(10.5) });
    if (cb.title) cb.title.font = Object.assign({}, cb.title.font || {}, { size: fs(10.5) });
  }
  return fig;
}

let lastFig = null, resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (lastFig) Plotly.react("map", lastFig.data, restyle(lastFig).layout, lastFig.config || {});
  }, 150);
});

let seq = 0, loadedStem = null;              // stem currently rendered OK (allows retry after a failed load)
async function go(i){
  if (i < 0 || i >= DATES.length) return;
  if (i === current && loadedStem === DATES[i]) return;
  current = i; markActive();
  const stem = DATES[i], mySeq = ++seq;
  history.replaceState(null, "", "#" + stem);
  setStatus("Loading " + stemLabel(stem) + "…");
  try {
    const fig = await loadFig(stem);
    if (mySeq !== seq) return;                 // a newer request superseded this one
    if (fig.layout.width)  baseW = fig.layout.width;
    if (fig.layout.height) baseH = fig.layout.height;
    await Plotly.react("map", fig.data, restyle(fig).layout, fig.config || {});
    lastFig = fig;
    loadedStem = stem;
    document.title = "Monthly — Fortran QC enabled, Python QC disabled — " + stemLabel(stem);
    setStatus("");
  } catch (err){
    if (mySeq === seq) setStatus("⚠ " + err.message + " — pick the date again to retry");
  }
}

document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
  if (e.key === "ArrowLeft") go(current - 1);
  if (e.key === "ArrowRight") go(current + 1);
});

fetch("dates.json").then(r => r.json()).then(dates => {
  DATES = dates;
  if (!DATES.length){ setStatus("No maps generated yet."); return; }
  buildNav();
  const want = location.hash.slice(1);
  const i = DATES.indexOf(want);
  go(i >= 0 ? i : 0);
}).catch(() => { setStatus("Could not load dates.json"); });
</script>
</body>
</html>
